<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classification Result</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: #eef5ff;
            background: radial-gradient(circle at top left, rgba(94, 182, 255, 0.34), transparent 18%),
                        radial-gradient(circle at bottom right, rgba(255, 164, 196, 0.2), transparent 20%),
                        linear-gradient(135deg, #0b1f3f 0%, #1b3d74 42%, #2a5da2 100%);
            background-attachment: fixed;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            opacity: 0.15;
            z-index: -1;
            filter: blur(16px) saturate(1.05);
        }
        .container {
            max-width: 860px;
            margin: 50px auto 60px;
            padding: 34px;
            background: rgba(14, 23, 52, 0.92);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.24);
            text-align: center;
            backdrop-filter: blur(14px);
        }
        h1 {
            color: #f9fbff;
            text-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
            margin-bottom: 14px;
            font-size: 2.8rem;
        }
        .result {
            margin: 24px 0;
            padding: 26px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }
        .result h2 {
            color: #d8e3ff;
            margin-bottom: 10px;
        }
        .result p {
            color: #cbd7ff;
            font-size: 1.05rem;
        }
        .image {
            max-width: 100%;
            height: auto;
            border-radius: 18px;
            margin: 24px 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.24);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        button {
            background: linear-gradient(135deg, #79d4ff 0%, #b388ff 100%);
            color: #07122d;
            padding: 14px 28px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 14px 30px rgba(47, 101, 205, 0.24);
            margin-top: 18px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 34px rgba(47, 101, 205, 0.32);
        }
        @media (max-width: 640px) {
            .container {
                margin: 28px 14px 40px;
                padding: 24px;
            }
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Classification Result</h1>
        
        <img src="data:image/jpeg;base64,{{ img_data }}" alt="Uploaded Image" class="image">
        
        <div class="result">
            <h2>Predicted Art Style: {{ predicted_class }}</h2>
            <p>Confidence: {{ "%.2f"|format(confidence) }}%</p>
        </div>
        
        <button onclick="window.location.href='/'">Classify Another Image</button>
    </div>
</body>
</html>
